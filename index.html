<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* Imagen fondo */
img{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    z-index:1;
}

/* Botón flotante */
.boton-agregar{
    position:fixed;
    right:40px;
    top:50%;
    transform:translateY(-50%);
    z-index:2;

    background:#4CAF50;
    color:white;
    border:none;
    padding:18px 28px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0px 6px 18px rgba(0,0,0,0.3);
    transition:0.2s;
}

.boton-agregar:hover{
    background:#43a047;
    transform:translateY(-50%) scale(1.05);
}
</style>
</head>

<body>

<img src="fondo.png">

<button class="boton-agregar">Agregar</button>

</body>
</html>
